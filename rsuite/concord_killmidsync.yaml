# concord-killmidsync: a workload
# submitted while meshed replicates during a sync window, survives a
# SIGKILL mid-reunion, and shows up on all nodes after a fresh restart.
# The C kills on the first post-blackout sync round-trip; here the sync
# phase heals and holds 15 s so several sync rounds pull k0 before the
# kill. Killing before any sync would wipe the only copy.
name: concord-killmidsync
version: 1
sut: concord
nodes: 3
timeout_s: 420
phases:
  - name: mesh
    until:
      peers: 3
      on: all
    timeout_s: 45
  - name: submit
    do:
      - submit:
          node: 2
          image: nginx:alpine
          as: k0
    until:
      mesh_count: 3
    timeout_s: 30
  - name: blackout
    do:
      - drop:
          - 2
    until:
      mesh_count: 2
    hold_s: 10
    timeout_s: 45
  - name: sync
    do:
      - heal: all
    until:
      peers: 3
      on: all
    hold_s: 15
    timeout_s: 60
  - name: kill
    do:
      - kill:
          node: 2
          signal: KILL
      - restart:
          node: 2
          durability: fresh
    until:
      mesh_count: 3
    timeout_s: 60
  - name: reunite
    do:
      - heal: all
    until:
      peers: 3
      on: all
    hold_s: 10
    timeout_s: 45
  - name: converged
    until:
      present:
        workload: k0
        on: all
    timeout_s: 120
