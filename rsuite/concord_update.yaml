# concord-update: a live workload
# bumped to a new image keeps its ID and assignment; the new image at
# epoch 1 converges on all nodes.
name: concord-update
version: 1
sut: concord
nodes: 3
timeout_s: 240
phases:
  - name: mesh
    until:
      peers: 3
      on: all
    timeout_s: 45
  - name: submit
    do:
      - submit:
          node: 0
          image: nginx:alpine
          as: w0
    until:
      assigned:
        workload: w0
    timeout_s: 60
  - name: move
    do:
      - update:
          workload: w0
          image: redis:alpine
    until:
      image:
        workload: w0
        value: redis:alpine
        on: all
    timeout_s: 90
  - name: bumped
    until:
      epoch:
        workload: w0
        node: 0
        eq: 1
    timeout_s: 30
