# concord-scale: five-node mesh plus
# workload converges after isolate and reunion.
name: concord-scale
version: 1
sut: concord
nodes: 5
timeout_s: 390
phases:
  - name: mesh
    until:
      peers: 5
      on: all
    timeout_s: 60
  - name: submit
    do:
      - submit:
          node: 0
          image: nginx:alpine
          as: s0
    until:
      present:
        workload: s0
        on: all
    timeout_s: 120
  - name: lively
    until:
      mesh_count: 5
    timeout_s: 30
  - name: split
    do:
      - drop:
          - 4
    until:
      mesh_count: 4
    hold_s: 10
    timeout_s: 45
  - name: reunite
    do:
      - heal: all
    until:
      peers: 5
      on: all
    hold_s: 10
    timeout_s: 60
  - name: converged
    until:
      present:
        workload: s0
        on: all
    timeout_s: 60
