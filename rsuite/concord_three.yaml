# concord-three: mesh, isolate node 2,
# reunion restores one mesh with a peer.lost marker from the split.
name: concord-three
version: 1
sut: concord
nodes: 3
timeout_s: 180
phases:
  - name: mesh
    until:
      peers: 3
      on: all
    timeout_s: 45
  - name: split
    do:
      - drop:
          - 2
    until:
      mesh_count: 2
    hold_s: 10
    timeout_s: 45
  - name: reunite
    do:
      - heal: all
    until:
      peers: 3
      on: all
    hold_s: 10
    timeout_s: 45
  - name: lost
    until:
      marker: peer.lost
      on: any
    timeout_s: 20
