# concord-restart: a SIGKILLED node
# restarted fresh rejoins the mesh.
name: concord-restart
version: 1
sut: concord
nodes: 3
timeout_s: 180
phases:
  - name: mesh
    until:
      peers: 3
      on: all
    timeout_s: 45
  - name: fault
    do:
      - kill:
          node: 2
          signal: KILL
      - restart:
          node: 2
          durability: fresh
    until:
      mesh_count: 3
    timeout_s: 60
  - name: reunite
    until:
      peers: 3
      on: all
    hold_s: 10
    timeout_s: 60
