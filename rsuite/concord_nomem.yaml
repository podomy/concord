# concord-nomem: a workload requesting
# more memory than any node holds reaches all nodes but never assigns,
# while a plain workload assigns and converges. Gap, stated honestly:
# YAML has no never-assigned condition, so the refusal is read through
# the small workload holding a stable unanimous assignment while the
# huge one stays listed everywhere.
name: concord-nomem
version: 1
sut: concord
nodes: 3
timeout_s: 300
phases:
  - name: mesh
    until:
      peers: 3
      on: all
    timeout_s: 45
  - name: submit
    do:
      - submit:
          node: 0
          image: nginx:alpine
          flags: "--memory 999999999999"
          as: big
      - submit:
          node: 0
          image: nginx:alpine
          as: small
    until:
      present:
        workload: big
        on: all
    timeout_s: 60
  - name: listed
    until:
      present:
        workload: small
        on: all
    timeout_s: 45
  - name: placed
    until:
      assigned:
        workload: small
    timeout_s: 60
  - name: single
    until:
      agree:
        workload: small
    timeout_s: 45
