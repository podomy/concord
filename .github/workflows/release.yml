name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build Release Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            output: concord-linux-amd64
            cc: gcc
            apt: gcc
          - os: linux
            arch: arm64
            output: concord-linux-arm64
            cc: aarch64-linux-gnu-gcc
            apt: gcc-aarch64-linux-gnu
          - os: linux
            arch: arm
            arm_version: "7"
            output: concord-linux-armv7
            cc: arm-linux-gnueabihf-gcc
            apt: gcc-arm-linux-gnueabihf
          - os: linux
            arch: riscv64
            output: concord-linux-riscv64
            cc: riscv64-linux-gnu-gcc
            apt: gcc-riscv64-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      # Container init joins namespaces through libcontainer's nsexec C
      # constructor, so every release binary needs a C toolchain for its
      # target. CGO_ENABLED=0 builds compile but grow containers whose
      # init can never join namespaces: do not turn it back off.
      - name: Install C toolchain
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}

      - name: Build binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          GOARM: ${{ matrix.arm_version }}
          CGO_ENABLED: "1"
          CC: ${{ matrix.cc }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o "dist/${{ matrix.output }}" ./cmd/concord

      - name: Zip binary
        run: |
          cd dist
          zip "${{ matrix.output }}-${{ github.ref_name }}.zip" "${{ matrix.output }}"

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}-${{ github.ref_name }}
          path: dist/${{ matrix.output }}-${{ github.ref_name }}.zip
          retention-days: 30

  release:
    name: Publish Bare Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      # gh release create shells out to git for repo context, so it
      # needs a checkout even though the zips come from artifacts.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Bare by policy: version and zips only, no description notes.
      # The changelog lives in CHANGELOG.md in the repo.
      - name: Create release and attach zips
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" dist/*.zip --title "${{ github.ref_name }}" --notes ""
