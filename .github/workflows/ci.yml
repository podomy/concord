name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - run: go mod tidy

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

      - run: go test -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  build:
    name: Build Binaries
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            output: concord-linux-amd64
            cc: gcc
            apt: gcc
          - os: linux
            arch: arm64
            output: concord-linux-arm64
            cc: aarch64-linux-gnu-gcc
            apt: gcc-aarch64-linux-gnu
          - os: linux
            arch: arm
            arm_version: "7"
            output: concord-linux-armv7
            cc: arm-linux-gnueabihf-gcc
            apt: gcc-arm-linux-gnueabihf
          - os: linux
            arch: riscv64
            output: concord-linux-riscv64
            cc: riscv64-linux-gnu-gcc
            apt: gcc-riscv64-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      # Container init joins namespaces through libcontainer's nsexec C
      # constructor, so every release binary needs a C toolchain for its
      # target. CGO_ENABLED=0 builds compile but grow containers whose
      # init can never join namespaces: do not turn it back off.
      - name: Install C toolchain
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}

      - name: Build binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          GOARM: ${{ matrix.arm_version }}
          CGO_ENABLED: "1"
          CC: ${{ matrix.cc }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o "dist/${{ matrix.output }}" .

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: dist/${{ matrix.output }}
          retention-days: 30
