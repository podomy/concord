name: rsuite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Long suite: cancel superseded runs on the same ref so a fast
# push train does not stack 40-minute runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    # Worst files budget 800s; 33 files at --jobs 4 usually land
    # well inside this. Raise if the suite grows, never lower
    # below the slowest file's timeout.
    timeout-minutes: 120
    env:
      # Pinned runner. Bump deliberately when concord's YAMLs need
      # a newer runner behavior; never float this.
      RESONANCE_SHA: 1b38c72b2753704f1195d784379760c99107c807
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: podomy/resonance
          ref: ${{ env.RESONANCE_SHA }}
          path: resonance

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      # Resonance builds strict C23 (constexpr needs Clang 19+).
      # The runner default gcc predates -std=c23, its default clang
      # predates constexpr, and GCC 14 rejects the codebase's
      # (void)system() idiom under -Werror=unused-result, so the C
      # build uses a pinned modern clang. Go's own CGO parts keep
      # the default gcc.
      - name: Install C toolchain
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 21

      - name: Build rsuite runner
        run: make -C resonance CC=clang-21 bin/rsuite

      # The SUT always comes from the concord tree under test,
      # never from an artifact or a reference checkout.
      - name: Build concord SUT
        run: go build -trimpath -o resonance/bin/concord ./cmd/concord
        env:
          CGO_ENABLED: "1"

      - name: Build test images
        run: make -C resonance img-build

      - name: Doctor
        run: ./bin/rsuite doctor
        working-directory: resonance

      - name: Lint scenarios
        run: ./bin/rsuite lint ../rsuite/*.yaml
        working-directory: resonance

      # Needs root for netns plus TUN. Workload scenarios pull
      # nginx:alpine from Docker Hub; anonymous Hub limits on
      # shared runners can flake those files with 429s.
      # Stale allocator locks from a killed run pin every id until
      # cleared; a fresh runner has none, so this is a no-op there.
      # Never remove these while a suite is live: two runs would
      # alias ids.
      - name: Clear stale run locks
        run: sudo rm -f /var/tmp/resonance-runs.lock /var/tmp/resonance-run-*.lock

      # Strace one file before the matrix: the allocator failure
      # is silent in C (only exhaustion prints), so a failing
      # acquire leaves no errno anywhere. Tracing open/flock on a
      # single fast file captures the exact failing call.
      # Diagnostic only: never fails the job.
      - name: Trace allocator syscalls
        run: |
          sudo apt-get install -y strace
          sudo timeout 120 strace -f -e trace=open,openat,flock -o /tmp/strace-acquire.log ./bin/rsuite run ../rsuite/concord_two.yaml || true
          TRACE=$(grep -E "flock\(|resonance" /tmp/strace-acquire.log | tail -n 60 || true)
          echo "$TRACE"
          ESC=$(printf '%s' "$TRACE" | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::notice title=rsuite-strace::$ESC"
        working-directory: resonance

      - name: Run regression suite
        run: sudo ./bin/rsuite run --jobs 4 ../rsuite/*.yaml
        working-directory: resonance

      # Allocator forensics: acquire fails silently on lock I/O,
      # loudly only on id exhaustion. The runner's view (lock
      # files, root doctor) tells which one bit. The summary goes
      # to an annotation, which is readable without log access.
      - name: Diagnose allocator on failure
        if: failure()
        run: |
          sudo ./bin/rsuite doctor > /tmp/alloc-diag.txt 2>&1 || true
          echo '--- locks ---' >> /tmp/alloc-diag.txt
          sudo ls -la /var/tmp/resonance-runs.lock /var/tmp/resonance-run-*.lock >> /tmp/alloc-diag.txt 2>&1 || true
          echo '--- self ---' >> /tmp/alloc-diag.txt
          id -u >> /tmp/alloc-diag.txt 2>&1
          df -h /var/tmp 2>&1 | tail -n 1 >> /tmp/alloc-diag.txt
          echo '--- live lock state (python fcntl probe) ---' >> /tmp/alloc-diag.txt
          sudo python3 >> /tmp/alloc-diag.txt 2>&1 <<'PYEOF' || true
          import fcntl, os
          G = '/var/tmp/resonance-runs.lock'
          try:
              fd = os.open(G, os.O_RDWR | os.O_CREAT, 0o600)
          except OSError as e:
              print('global open failed: errno %d %s' % (e.errno, e.strerror))
          else:
              try:
                  fcntl.flock(fd, fcntl.LOCK_EX | fcntl.LOCK_NB)
                  print('global lock: FREE')
              except OSError as e:
                  print('global lock: HELD (errno %d %s)' % (e.errno, e.strerror))
              os.close(fd)
          held = 0
          first_free = None
          present = 0
          for i in range(1, 155):
              p = '/var/tmp/resonance-run-%d.lock' % i
              try:
                  fd = os.open(p, os.O_RDWR)
              except OSError:
                  continue
              present += 1
              try:
                  fcntl.flock(fd, fcntl.LOCK_EX | fcntl.LOCK_NB)
                  if first_free is None:
                      first_free = i
              except OSError:
                  held += 1
              finally:
                  os.close(fd)
          print('id files present: %d, locked: %d, first free: %s' % (present, held, first_free))
          PYEOF
          cat /tmp/alloc-diag.txt
          ESC=$(sed -e 's/%/%25/g' /tmp/alloc-diag.txt | awk '{printf "%s%%0A", $0}')
          echo "::error title=rsuite-acquire::$ESC"
        working-directory: resonance

      # Child stderr (including any "sim:" allocator diagnostics)
      # lands in the per-file logs. Surface it: exhaustion text
      # means the open path failed, silence means flock failed.
      - name: Surface child diagnostics
        if: failure()
        run: |
          DIAG=$(sudo grep -h "sim:" /var/tmp/resonance-rsuite-*/concord_*.log 2>&1 | sort | uniq -c | head -n 20 || true)
          echo "$DIAG"
          ESC=$(printf '%s' "$DIAG" | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::notice title=rsuite-childerr::$ESC"
        working-directory: resonance

      - name: Collect logs on failure
        if: failure()
        run: sudo tar -czf /tmp/rsuite-logs.tar.gz /var/tmp/resonance-* || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rsuite-logs
          path: /tmp/rsuite-logs.tar.gz
          if-no-files-found: ignore
          retention-days: 30
